name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install rsync and sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Prepare standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Push files to ECS via rsync
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PASS: ${{ secrets.ECS_PASS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -p "$ECS_PASS" ssh "$ECS_USER@$ECS_HOST" "mkdir -p /var/www/huize-jiagong"
          sshpass -p "$ECS_PASS" rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            .next/standalone deploy.sh \
            "$ECS_USER@$ECS_HOST:/var/www/huize-jiagong/"

      - name: Run deploy script on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PASS: ${{ secrets.ECS_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh "$ECS_USER@$ECS_HOST" "bash /var/www/huize-jiagong/deploy.sh"
