name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install rsync and sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Upload build to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PASS: ${{ secrets.ECS_PASS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 在 ECS 上创建目录
          sshpass -p "$ECS_PASS" ssh "$ECS_USER@$ECS_HOST" "mkdir -p /var/www/huize-jiagong"

          # 推送构建产物和配置文件（ECS 不需要访问 GitHub）
          sshpass -p "$ECS_PASS" rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.ts \
            "$ECS_USER@$ECS_HOST:/var/www/huize-jiagong/"

      - name: Start / restart app on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PASS: ${{ secrets.ECS_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh "$ECS_USER@$ECS_HOST" bash << 'ENDSSH'
            set -e
            cd /var/www/huize-jiagong

            # 安装 PM2（如未安装）
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # 安装生产依赖
            npm install --omit=dev

            # 写 PM2 配置
            cat > ecosystem.config.js << 'EOF'
module.exports = {
  apps: [{
    name: "huize-jiagong",
    script: "node_modules/.bin/next",
    args: "start -p 3001",
    cwd: "/var/www/huize-jiagong",
    env: { NODE_ENV: "production", PORT: "3001" }
  }]
};
EOF

            pm2 reload huize-jiagong 2>/dev/null || pm2 start ecosystem.config.js
            pm2 save

            # 写 Nginx 配置（首次）
            if [ ! -f /etc/nginx/conf.d/huize-jiagong.conf ]; then
              cat > /etc/nginx/conf.d/huize-jiagong.conf << 'NGINX'
server {
    listen 80;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
NGINX
              nginx -t && nginx -s reload
            fi

            echo "Deploy done"
            pm2 list
ENDSSH
