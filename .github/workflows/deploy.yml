name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASS }}
          script: |
            set -e

            # 安装 PM2（如未安装）
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # 安装 git（如未安装）
            if ! command -v git &> /dev/null; then
              apt-get install -y git
            fi

            # 克隆或拉取代码（清理残留目录再 clone）
            if [ -d "/var/www/huize-jiagong/.git" ]; then
              cd /var/www/huize-jiagong
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf /var/www/huize-jiagong
              mkdir -p /var/www
              git clone https://github.com/${{ github.repository }}.git /var/www/huize-jiagong
            fi

            cd /var/www/huize-jiagong

            # 安装依赖 & 构建
            npm ci
            npm run build

            # 写入 PM2 配置（如不存在）
            cat > ecosystem.config.js << 'EOF'
            module.exports = {
              apps: [{
                name: 'huize-jiagong',
                script: 'node_modules/.bin/next',
                args: 'start -p 3001',
                cwd: '/var/www/huize-jiagong',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3001
                }
              }]
            };
            EOF

            # 重启或启动
            pm2 reload huize-jiagong || pm2 start ecosystem.config.js
            pm2 save

            # 写入 Nginx 配置（如不存在）
            if [ ! -f /etc/nginx/conf.d/huize-jiagong.conf ]; then
              cat > /etc/nginx/conf.d/huize-jiagong.conf << 'NGINXEOF'
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINXEOF
              nginx -t && nginx -s reload
            fi

            echo "✅ 部署完成"
